apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bankai
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: bankai-backend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: PORT

            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: FRONTEND_URL

            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: REDIS_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bankai-secrets
                  key: JWT_SECRET

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bankai-secrets
                  key: GEMINI_API_KEY

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bankai
spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP