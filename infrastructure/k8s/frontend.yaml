apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bankai
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: bankai-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:5000"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bankai

spec:
  type: NodePort

  selector:
    app: frontend

  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP