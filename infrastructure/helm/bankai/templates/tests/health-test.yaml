apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-health-test"
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3

  template:
    metadata:
      name: "{{ .Release.Name }}-health-test"
    spec:
      restartPolicy: Never

      containers:
        - name: health-test
          image: busybox:1.36.1

          command:
            - sh
            - -c

          args:
            - |
              set -e

              echo "====================================="
              echo "BankAI Helm Release Health Test"
              echo "====================================="

              echo ""
              echo "Testing backend..."
              BACKEND_RESPONSE="$(wget -qO- http://backend:{{ .Values.backend.port }}/api/health)"

              echo "Backend response:"
              echo "$BACKEND_RESPONSE"

              echo "$BACKEND_RESPONSE" | grep -q '"success":true'

              echo ""
              echo "Backend test passed."

              echo ""
              echo "Testing frontend..."

              wget -qO /tmp/frontend.html \
                http://frontend:{{ .Values.frontend.port }}/

              grep -qi "<html" /tmp/frontend.html

              echo ""
              echo "Frontend test passed."

              echo ""
              echo "====================================="
              echo "BankAI Helm health tests passed."
              echo "====================================="