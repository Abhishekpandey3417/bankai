apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.worker.replicas }}

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: NODE_ENV

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bankai-config
                  key: REDIS_URL