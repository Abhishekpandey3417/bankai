services:
  postgres:
    image: postgres:17
    container_name: bankai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankai

    ports:
      - "5432:5432"

    volumes:
      - bankai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bankai-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - bankai_redis_data:/data

volumes:
  bankai_postgres_data:
  bankai_redis_data:
