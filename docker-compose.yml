services:

  postgres:
    image: postgres:17
    container_name: bankai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankai

    ports:
      - "5432:5432"

    volumes:
      - bankai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d bankai" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bankai-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - bankai_redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bankai-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankai

      REDIS_URL: redis://redis:6379

      FRONTEND_URL: http://localhost:3000

      JWT_SECRET: ${JWT_SECRET}

      GEMINI_API_KEY: ${GEMINI_API_KEY}

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

    container_name: bankai-worker
    restart: unless-stopped

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bankai

      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: bankai-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production

      NEXT_PUBLIC_API_URL: http://localhost:5000

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  bankai_postgres_data:
  bankai_redis_data:
